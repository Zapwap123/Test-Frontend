name: Deploy to ECS

on:
  workflow_call:
    inputs:
      image_uri:
        required: true
        type: string
    secrets:
      AWS_REGION:
        required: true
      AWS_ROLE_TO_ASSUME:
        required: true
      ECS_CLUSTER:
        required: true
      ECS_SERVICE:
        required: true
      TASK_DEF_FILE:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Show image URI received
        run: echo "image_uri input: $IMAGE_URI"
        env:
          IMAGE_URI: ${{ inputs.image_uri }}

      - name: List task definition file
        run: ls -la Infrastructure/${{ secrets.TASK_DEF_FILE }}

      - name: Show task definition before replacement
        run: cat Infrastructure/${{ secrets.TASK_DEF_FILE }}

      - name: Replace image URI in ECS task definition
        run: |
          sed -i "s|<IMAGE_URI>|${{ inputs.image_uri }}|g" Infrastructure/${{ secrets.TASK_DEF_FILE }}

      - name: Show task definition after replacement
        run: cat Infrastructure/${{ secrets.TASK_DEF_FILE }}

      - name: Fail early if replacement did not work
        run: |
          if grep -q "<IMAGE_URI>" Infrastructure/${{ secrets.TASK_DEF_FILE }}; then
            echo " ERROR: <IMAGE_URI> was NOT replaced!"
            exit 1
          fi
          echo " <IMAGE_URI> was successfully replaced."

      - name: Register new ECS task definition
        id: task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://Infrastructure/${{ secrets.TASK_DEF_FILE }} \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Force ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
